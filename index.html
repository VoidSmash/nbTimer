<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bhat Timer & Method Suite</title>
  <script src="https://tailwindcss.com"></script>
  <!-- 3D Twisty Player & FTO Scrambler from cubing.js -->
  <script type="module" src="https://cubing.net"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">

  <!-- Top Navigation -->
  <header class="flex flex-wrap justify-between items-center px-6 py-4 bg-slate-900 border-b border-slate-800">
    <h1 class="text-xl font-bold tracking-tight text-cyan-400">BHAT TIMER &amp; SUITE</h1>
    <nav class="flex gap-2">
      <button onclick="switchTab('timer')" id="nav-timer" class="px-4 py-1.5 rounded-lg font-medium bg-cyan-500 text-slate-950">Timer</button>
      <button onclick="switchTab('methods')" id="nav-methods" class="px-4 py-1.5 rounded-lg font-medium bg-slate-800 text-slate-300 hover:bg-slate-700">Bhat Methods</button>
      <button onclick="switchTab('trainer')" id="nav-trainer" class="px-4 py-1.5 rounded-lg font-medium bg-slate-800 text-slate-300 hover:bg-slate-700">Alg &amp; Subset Trainer</button>
    </nav>
  </header>

  <!-- TAB 1: PRO TIMER -->
  <main id="tab-timer" class="grid grid-cols-1 lg:grid-cols-4 gap-6 p-6">
    <!-- Left Sidebar: Session & Stats -->
    <aside class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-4">
      <select id="event-select" onchange="changeEvent()" class="w-full bg-slate-800 text-white p-2.5 rounded-lg font-semibold"></select>

      <div class="grid grid-cols-2 gap-2 text-center bg-slate-950 p-3 rounded-lg">
        <div><span class="text-xs text-slate-400 block">Ao5</span><span id="stat-ao5" class="font-mono text-lg text-emerald-400">-</span></div>
        <div><span class="text-xs text-slate-400 block">Ao12</span><span id="stat-ao12" class="font-mono text-lg text-cyan-400">-</span></div>
      </div>

      <div id="solve-list" class="max-h-80 overflow-y-auto space-y-1.5"></div>
    </aside>

    <!-- Main Timer & 3D Preview -->
    <section class="lg:col-span-3 flex flex-col justify-between items-center bg-slate-900 p-8 rounded-xl border border-slate-800 min-h-[480px]">
      <div class="text-center space-y-2">
        <p id="scramble-text" class="text-xl md:text-2xl font-mono tracking-wide text-slate-100">Loading scramble...</p>
        <button onclick="generateScramble()" class="text-xs text-cyan-400 hover:underline">New Scramble</button>
      </div>

      <div id="timer-display" class="text-7xl md:text-8xl font-mono font-bold select-none text-white">0.00</div>
      <p class="text-xs text-slate-500">Hold <b>Spacebar</b> (or touch &amp; hold timer on mobile) until green, then release</p>

      <div id="timer-twisty" class="w-full max-w-xs flex justify-center"></div>
    </section>
  </main>

  <!-- TAB 2: BHAT METHOD ACADEMY -->
  <main id="tab-methods" class="hidden max-w-5xl mx-auto p-6 space-y-6">
    <div id="method-buttons" class="flex flex-wrap gap-2"></div>
    <div id="method-content" class="bg-slate-900 p-6 rounded-xl border border-slate-800 space-y-4"></div>
  </main>

  <!-- TAB 3: ALG & SUBSET TRAINER -->
  <main id="tab-trainer" class="hidden max-w-3xl mx-auto p-6 space-y-6">
    <div id="trainer-buttons" class="flex flex-wrap gap-2"></div>
    <div class="bg-slate-900 p-6 rounded-xl border border-slate-800 text-center space-y-4">
      <span id="trainer-badge" class="px-3 py-1 bg-slate-800 rounded-full text-xs text-cyan-400 font-mono"></span>
      <p id="trainer-setup" class="text-lg font-mono text-amber-300"></p>
      <div id="trainer-twisty" class="w-full flex justify-center"></div>
      <p id="trainer-alg" class="hidden text-xl font-mono font-bold text-emerald-400"></p>
      <div class="flex justify-center gap-3">
        <button onclick="revealAlg()" id="btn-reveal" class="px-5 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg font-semibold">Reveal &amp; Play Algorithm</button>
        <button onclick="nextCase()" class="px-6 py-2 bg-emerald-500 text-slate-950 font-bold rounded-lg hover:bg-emerald-400">Next Case &rarr;</button>
      </div>
    </div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
